[package]
name = "night-window"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[lints]
workspace = true

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Integration tests against the demo contracts, compiled natively.
fund-token = { path = "../fund-token" }
nav-oracle = { path = "../nav-oracle" }
