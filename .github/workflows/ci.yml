name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; jobs widen only what they need.
permissions:
  contents: read

# One run at a time per pull request: a new push cancels the run of the
# previous one. A run on main is never cancelled.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Third-party actions are pinned to a full commit SHA (the tag is a comment).
# Dependabot (.github/dependabot.yml) proposes the bumps as reviewable PRs.
# No job pushes: every checkout leaves the token out of the git config
# (persist-credentials: false), so no later step or dependency can reuse it.
#
# A pull request runs only the jobs its files need (job `changes`, from
# .github/scripts/changes.mjs); a push to main, a manual run and any change
# under .github/ run everything. `ci-ok` is the one check to require: it
# passes when every job it needs passed or was skipped as not needed.
jobs:
  changes:
    # The areas the change touches, and the critical paths among them.
    # Anything the script does not understand turns every area on.
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 from 19 October 2026
    outputs:
      rust: ${{ steps.areas.outputs.rust }}
      web: ${{ steps.areas.outputs.web }}
      tooling: ${{ steps.areas.outputs.tooling }}
      docs: ${{ steps.areas.outputs.docs }}
      ci: ${{ steps.areas.outputs.ci }}
      critical: ${{ steps.areas.outputs.critical }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the diff needs both ends of the change
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Test the scripts
        run: node --test ".github/scripts/*.test.mjs"
      # The commit ids reach the script through the environment, never
      # through an expression inside the command.
      - name: Areas touched
        id: areas
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/changes.mjs

  contracts:
    needs: changes
    if: needs.changes.outputs.rust != 'false'
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 from 19 October 2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The action derives the CLI version from the action ref; a SHA pin would
      # yield a non-existent release, so the version is passed explicitly.
      - uses: stellar/stellar-cli@c0f4d0da891bbf214c08b8c5035ae6db80e9a3bd # v28.1.0
        with:
          version: 28.1.0
      - name: Format
        run: cargo fmt --all --check
      # Built before lint and test: the upgrade test uploads this WASM, and
      # `clippy --all-targets` compiles that test (contracts/night-window/build.rs).
      - name: Build WASM
        run: stellar contract build
      # Code rent grows with the WASM size and the network limit is 128 KB:
      # fail early if the contract outgrows its budget (decision S20).
      - name: WASM size budget (120 KB)
        run: |
          size=$(stat -c%s target/wasm32v1-none/release/night_window.wasm)
          echo "night_window.wasm: $size bytes"
          test "$size" -le 122880 || { echo "::error::night_window.wasm is $size bytes, over the 122,880-byte budget"; exit 1; }
      - name: Lint (security lints are denied in Cargo.toml)
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  wasm-canary:
    # The contract's whole test suite run in the VM, against a WASM linked
    # with an 8 KiB stack instead of the 64 KiB it ships with (WASM test
    # mode, contracts/night-window/build.rs). The suite passes with 2 KiB and
    # fails with 1 KiB, so a change that deepens the stack fails here long
    # before it nears the shipped margin. A target directory of its own keeps
    # this WASM apart from the release one.
    needs: changes
    if: needs.changes.outputs.rust != 'false'
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 from 19 October 2026
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-canary
      NIGHT_WINDOW_STACK_SIZE: "8192"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ". -> target-canary"
      # The action derives the CLI version from the action ref; a SHA pin would
      # yield a non-existent release, so the version is passed explicitly.
      - uses: stellar/stellar-cli@c0f4d0da891bbf214c08b8c5035ae6db80e9a3bd # v28.1.0
        with:
          version: 28.1.0
      # Every member: the real-time profile also runs the share token's and
      # the feed's WASM.
      - name: Build the WASM with an 8 KiB stack
        run: stellar contract build
      - name: Test against that WASM
        run: cargo test -p night-window
        env:
          NIGHT_WINDOW_TEST_WASM: "1"

  web:
    needs: changes
    if: needs.changes.outputs.web != 'false'
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 from 19 October 2026
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # No package of the bundle needs an install script (only the optional
      # fsevents has one): a compromised release cannot run code at install.
      - name: Install (exact versions from the lockfile, no install scripts)
        run: npm ci --ignore-scripts
      # The bundle asks visitors for signatures: a runtime dependency with a
      # known high or critical advisory stops the build (web-5).
      - name: Advisories on the runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build
      # Unit tests only: the testnet tests need the demo keys and run locally.
      - name: Test
        run: npm test

  tooling:
    # The monitor's detectors and actions, the demo library's checks before
    # signing, and the indexer: offline tests on stubbed chain reads, no key.
    # The testnet scripts themselves (setup, run, the rehearsal) run locally.
    needs: changes
    if: needs.changes.outputs.tooling != 'false'
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 from 19 October 2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            demo/package-lock.json
            indexer/package-lock.json
      # The testnet scripts (setup, run, the monitor's watch and rehearsal)
      # have no offline test: their syntax at least is checked, every file.
      - name: Syntax of every demo and indexer script
        run: for f in demo/*.mjs demo/test/*.mjs demo/test/stub/*.mjs indexer/*.mjs indexer/lib/*.mjs indexer/test/*.mjs; do node --check "$f" || exit 1; done
      - name: Install the demo (exact versions, no install scripts)
        working-directory: demo
        run: npm ci --ignore-scripts
      - name: Test the demo
        working-directory: demo
        run: npm test
      - name: Install the indexer (exact versions, no install scripts)
        working-directory: indexer
        run: npm ci --ignore-scripts
      - name: Test the indexer
        working-directory: indexer
        run: npm test

  deny:
    needs: changes
    if: needs.changes.outputs.rust != 'false'
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 from 19 October 2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Licences, advisories, sources and duplicate versions (deny.toml).
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  audit:
    needs: changes
    if: needs.changes.outputs.rust != 'false'
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 from 19 October 2026
    permissions:
      contents: read
      checks: write # audit-check publishes its result as a check run
      issues: write # audit-check opens an issue when an advisory lands
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The ignored ids and their reasons are those of deny.toml, [advisories].
      - name: RustSec advisories on Cargo.lock
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: RUSTSEC-2024-0436,RUSTSEC-2026-0387

  public-guard:
    # The working documents under private/ and references/ are git-ignored
    # (AGENTS.md, "What stays out"): a path tracked there fails the run.
    # Paths only; the content of tracked files is reviewed by people.
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 from 19 October 2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Nothing tracked under private/ or references/
        run: |
          files=$(git ls-files -- private references)
          if [ -n "$files" ]; then
            echo "::error::tracked files under private/ or references/"
            echo "$files"
            exit 1
          fi
          echo "none"

  critical-review:
    # A change to a path that holds funds, signatures or the review rules
    # (.github/scripts/critical.mjs, .github/CODEOWNERS) gets its review
    # checklist: in the job summary and as a warning on every run, and on a
    # pull request from this repository as one comment, kept current, with
    # the label `critical-path`. It blocks nobody and is not part of ci-ok;
    # a fork's pull request cannot be commented on with a read-only token.
    needs: changes
    if: needs.changes.outputs.critical != '[]'
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 from 19 October 2026
    permissions:
      contents: read
      pull-requests: write
      issues: write
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: The checklist for the areas touched
        env:
          AREAS: ${{ needs.changes.outputs.critical }}
        run: |
          node .github/scripts/critical.mjs render "$AREAS" > "$RUNNER_TEMP/checklist.md"
          cat "$RUNNER_TEMP/checklist.md" >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::critical paths touched: $AREAS"
      # Pull-request data reaches the shell through the environment only.
      - name: Post it once on the pull request, and keep it current
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- critical-path-review -->"))) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$RUNNER_TEMP/checklist.md" > /dev/null
          else
            gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/checklist.md"
          fi
          gh api -X POST "repos/$REPO/issues/$PR/labels" -f 'labels[]=critical-path' > /dev/null

  links:
    # Internal links of the documentation (README, docs/, demo/, web/). External
    # URLs are not fetched: the check is deterministic and never fails on a
    # third-party outage. Advisory until the end of the October 2026 freeze,
    # so not part of ci-ok.
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 from 19 October 2026
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Markdown links (offline)
        uses: lycheeverse/lychee-action@885c65f3dc543b57c898c8099f4e08c8afd178a2 # v2.6.1
        with:
          args: --offline --no-progress --include-fragments './README.md' './SECURITY.md' './AGENTS.md' './docs/**/*.md' './demo/README.md' './web/README.md'
          fail: true

  ci-ok:
    # The one check to require: green when every job above that the change
    # needed passed, and the others were skipped. A failed or cancelled job
    # anywhere in the list fails it.
    needs: [changes, contracts, wasm-canary, web, tooling, deny, audit, public-guard]
    if: always()
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 from 19 October 2026
    steps:
      - name: Every needed job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.RESULTS);
            const bad = [];
            for (const [job, { result }] of Object.entries(needs)) {
              console.log(`${job}: ${result}`);
              if (result === "failure" || result === "cancelled") bad.push(job);
            }
            if (bad.length) { console.log(`::error::${bad.join(", ")}`); process.exit(1); }
          '
