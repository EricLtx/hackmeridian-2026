name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; jobs widen only what they need.
permissions:
  contents: read

# Third-party actions are pinned to a full commit SHA (the tag is a comment).
# Dependabot (.github/dependabot.yml) proposes the bumps as reviewable PRs.
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The action derives the CLI version from the action ref; a SHA pin would
      # yield a non-existent release, so the version is passed explicitly.
      - uses: stellar/stellar-cli@c0f4d0da891bbf214c08b8c5035ae6db80e9a3bd # v28.1.0
        with:
          version: 28.1.0
      - name: Format
        run: cargo fmt --all --check
      # Built before lint and test: the upgrade test uploads this WASM, and
      # `clippy --all-targets` compiles that test (contracts/night-window/build.rs).
      - name: Build WASM
        run: stellar contract build
      - name: Lint (security lints are denied in Cargo.toml)
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install (exact versions from the lockfile)
        run: npm ci
      - name: Build
        run: npm run build
      # Unit tests only: the testnet tests need the demo keys and run locally.
      - name: Test
        run: npm test

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # audit-check publishes its result as a check run
      issues: write # audit-check opens an issue when an advisory lands
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: RustSec advisories on Cargo.lock
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
