# Publishes the web interface (web/) on GitHub Pages: the testnet interface
# anyone can open, with the deployment file and the indexer's export that are
# committed under web/public/. Nothing here holds a key: the page reads the
# chain and signs with the visitor's own wallet.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 from 19 October 2026
    defaults:
      run:
        working-directory: web
    steps:
      # Nothing here pushes: the token stays out of the git config.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # No package of the bundle needs an install script (only the optional
      # fsevents has one): a compromised release cannot run code at install.
      - name: Install (exact versions from the lockfile, no install scripts)
        run: npm ci --ignore-scripts
      # The published page asks visitors for signatures: a runtime dependency
      # with a known high or critical advisory is never deployed (web-5).
      - name: Advisories on the runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
