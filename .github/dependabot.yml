# Keeps the SHA-pinned GitHub Actions and the Rust dependencies current through
# reviewable pull requests, so pins are updated deliberately rather than drifting.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /demo
    schedule:
      interval: weekly
