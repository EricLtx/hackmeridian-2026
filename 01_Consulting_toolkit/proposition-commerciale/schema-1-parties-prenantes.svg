<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 606" font-family="'Segoe UI', Arial, sans-serif">
  <title>Schéma 1 — Parties prenantes, rôles et flux</title>
  <defs>
    <marker id="m-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker>
    <marker id="m-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D28D9"/></marker>
    <marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker>
    <marker id="m-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker>
  </defs>
  <style>
    .box { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.2; }
    .core { fill: #1E3A5F; }
    .t { font-size: 16px; font-weight: 700; fill: #1E293B; }
    .s { font-size: 12px; fill: #64748B; }
    .b { font-size: 12px; fill: #1F2937; }
    .g { font-size: 12px; font-weight: 700; fill: #0F766E; }
    .l { font-size: 11.5px; font-weight: 600; }
    .n { font-size: 11.5px; font-weight: 700; text-anchor: middle; }
    .teal { stroke: #0F766E; stroke-width: 2; fill: none; }
    .violet { stroke: #6D28D9; stroke-width: 2; fill: none; }
    .orange { stroke: #C2410C; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .slate { stroke: #475569; stroke-width: 1.6; fill: none; }
    .gray { stroke: #6B7280; stroke-width: 1.4; fill: none; stroke-dasharray: 4 4; }
    .badge { fill: #FFFFFF; stroke-width: 1.6; }
  </style>

  <!-- Fonds -->
  <rect class="box" x="335" y="10" width="330" height="112" rx="8"/>
  <text class="t" x="500" y="33" text-anchor="middle">Fonds monétaire tokenisé</text>
  <text class="s" x="500" y="51" text-anchor="middle">Émetteur : Spiko, Franklin Templeton</text>
  <text class="b" x="500" y="73" text-anchor="middle">Émet les parts, verse le rendement,</text>
  <text class="b" x="500" y="89" text-anchor="middle">ouvre son guichet une fois par jour ouvré.</text>
  <text class="g" x="500" y="110" text-anchor="middle">Gain : parts plus utiles, encours en hausse</text>

  <!-- Emprunteur -->
  <rect class="box" x="14" y="196" width="256" height="176" rx="8"/>
  <text class="t" x="30" y="220">Emprunteur</text>
  <text class="s" x="30" y="239">Détenteur de parts du fonds</text>
  <text class="s" x="30" y="255">Exemple : société de paiement</text>
  <text class="b" x="30" y="282">Dépose ses parts en garantie pour</text>
  <text class="b" x="30" y="298">obtenir des stablecoins quand le</text>
  <text class="b" x="30" y="314">guichet du fonds est fermé.</text>
  <text class="g" x="30" y="348">Gain : trésorerie placée à 100 %</text>

  <!-- Contrat -->
  <rect class="core" x="400" y="196" width="200" height="176" rx="10"/>
  <text x="500" y="223" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Contrat de pension</text>
  <text x="500" y="241" text-anchor="middle" font-size="12" fill="#C7D5E8">Soroban, sur Stellar</text>
  <text x="500" y="270" text-anchor="middle" font-size="12" fill="#FFFFFF">Tient les offres des prêteurs</text>
  <text x="500" y="288" text-anchor="middle" font-size="12" fill="#FFFFFF">Garde les parts en garantie</text>
  <text x="500" y="306" text-anchor="middle" font-size="12" fill="#FFFFFF">Verse et rembourse</text>
  <text x="500" y="324" text-anchor="middle" font-size="12" fill="#FFFFFF">en une seule transaction</text>
  <text x="500" y="353" text-anchor="middle" font-size="12" font-weight="700" fill="#7FE0D2">Disponible 24 h / 24</text>

  <!-- Prêteur -->
  <rect class="box" x="730" y="196" width="256" height="176" rx="8"/>
  <text class="t" x="746" y="220">Prêteur</text>
  <text class="s" x="746" y="239">Apporteur de stablecoins</text>
  <text class="s" x="746" y="255">Exemple : coffre de rendement</text>
  <text class="b" x="746" y="282">Dépose ses stablecoins dans une</text>
  <text class="b" x="746" y="298">offre : taux, durée maximale,</text>
  <text class="b" x="746" y="314">fonds acceptés.</text>
  <text class="g" x="746" y="348">Gain : intérêt, parts en garantie</text>

  <!-- Flux emprunteur / contrat -->
  <line class="violet" x1="273" y1="226" x2="396" y2="226" marker-end="url(#m-violet)"/>
  <text class="l" x="335" y="211" text-anchor="middle" fill="#6D28D9">parts</text>
  <circle class="badge" cx="335" cy="226" r="9.5" stroke="#6D28D9"/><text class="n" x="335" y="230" fill="#6D28D9">2</text>

  <line class="teal" x1="397" y1="264" x2="274" y2="264" marker-end="url(#m-teal)"/>
  <text class="l" x="335" y="249" text-anchor="middle" fill="#0F766E">stablecoins</text>
  <circle class="badge" cx="335" cy="264" r="9.5" stroke="#0F766E"/><text class="n" x="335" y="268" fill="#0F766E">3</text>

  <line class="teal" x1="273" y1="310" x2="396" y2="310" marker-end="url(#m-teal)"/>
  <text class="l" x="335" y="295" text-anchor="middle" fill="#0F766E">principal + intérêt</text>
  <circle class="badge" cx="335" cy="310" r="9.5" stroke="#0F766E"/><text class="n" x="335" y="314" fill="#0F766E">4</text>

  <line class="violet" x1="397" y1="348" x2="274" y2="348" marker-end="url(#m-violet)"/>
  <text class="l" x="335" y="333" text-anchor="middle" fill="#6D28D9">parts</text>
  <circle class="badge" cx="335" cy="348" r="9.5" stroke="#6D28D9"/><text class="n" x="335" y="352" fill="#6D28D9">5</text>

  <!-- Flux contrat / prêteur -->
  <line class="teal" x1="727" y1="226" x2="604" y2="226" marker-end="url(#m-teal)"/>
  <text class="l" x="666" y="211" text-anchor="middle" fill="#0F766E">offre</text>
  <circle class="badge" cx="666" cy="226" r="9.5" stroke="#0F766E"/><text class="n" x="666" y="230" fill="#0F766E">1</text>

  <line class="teal" x1="603" y1="286" x2="726" y2="286" marker-end="url(#m-teal)"/>
  <text class="l" x="666" y="271" text-anchor="middle" fill="#0F766E">principal + intérêt</text>
  <circle class="badge" cx="666" cy="286" r="9.5" stroke="#0F766E"/><text class="n" x="666" y="290" fill="#0F766E">6</text>

  <line class="orange" x1="603" y1="346" x2="726" y2="346" marker-end="url(#m-orange)"/>
  <text class="l" x="666" y="331" text-anchor="middle" fill="#C2410C">défaut : parts</text>
  <circle class="badge" cx="666" cy="346" r="9.5" stroke="#C2410C"/><text class="n" x="666" y="350" fill="#C2410C">7</text>

  <!-- Relations avec le fonds -->
  <path class="slate" d="M333,66 C 215,66 142,112 142,193" marker-start="url(#m-slate)" marker-end="url(#m-slate)"/>
  <text class="l" x="162" y="148" fill="#475569">Guichet du fonds, jours ouvrés :</text>
  <text class="l" x="162" y="164" fill="#475569">souscription, rachat, rendement</text>

  <line class="gray" x1="500" y1="124" x2="500" y2="193" marker-end="url(#m-gray)"/>
  <text class="l" x="512" y="152" fill="#6B7280">autorise le contrat</text>
  <text class="l" x="512" y="167" fill="#6B7280">à détenir les parts</text>

  <path class="orange" d="M858,193 C 858,112 785,66 668,66" marker-end="url(#m-orange)"/>
  <text class="l" x="840" y="148" text-anchor="end" fill="#C2410C">Après un défaut : parts</text>
  <text class="l" x="840" y="164" text-anchor="end" fill="#C2410C">présentées au guichet</text>

  <!-- Fournisseur de prix -->
  <rect class="box" x="150" y="448" width="280" height="92" rx="8"/>
  <text class="t" x="166" y="471" font-size="15">Fournisseur de prix</text>
  <text class="s" x="166" y="489">Oracle SEP-40 : RedStone, Reflector</text>
  <text class="b" x="166" y="511">Publie la valeur de la part ; le contrat</text>
  <text class="b" x="166" y="527">en déduit le montant prêtable.</text>
  <line class="gray" x1="290" y1="448" x2="453" y2="376" marker-end="url(#m-gray)"/>
  <text class="l" x="358" y="412" text-anchor="end" fill="#6B7280">valeur de la part</text>

  <!-- Administrateur -->
  <rect class="box" x="570" y="448" width="280" height="92" rx="8"/>
  <text class="t" x="586" y="471" font-size="15">Administrateur</text>
  <text class="s" x="586" y="489">Équipe du projet, puis gouvernance</text>
  <text class="b" x="586" y="511">Tient la liste des fonds acceptés et</text>
  <text class="b" x="586" y="527">leurs décotes ; met à jour le code.</text>
  <line class="gray" x1="710" y1="448" x2="547" y2="376" marker-end="url(#m-gray)"/>
  <text class="l" x="642" y="412" fill="#6B7280">paramètres, mises à jour</text>

  <!-- Réseau et financeur -->
  <rect x="14" y="552" width="972" height="26" rx="6" fill="#EEF2F7"/>
  <text x="500" y="569.5" text-anchor="middle" font-size="12" fill="#1E3A5F">Réseau Stellar : règlement en 5 secondes, 24 h / 24   ·   Stellar Development Foundation et Community Fund : financement, mise en relation</text>

  <!-- Légende -->
  <line class="teal" x1="14" y1="595" x2="46" y2="595"/><text x="54" y="599" font-size="11.5" fill="#1F2937">stablecoins</text>
  <line class="violet" x1="150" y1="595" x2="182" y2="595"/><text x="190" y="599" font-size="11.5" fill="#1F2937">parts de fonds</text>
  <line class="slate" x1="304" y1="595" x2="336" y2="595"/><text x="344" y="599" font-size="11.5" fill="#1F2937">relation avec le fonds, hors contrat</text>
  <line class="gray" x1="566" y1="595" x2="598" y2="595"/><text x="606" y="599" font-size="11.5" fill="#1F2937">information, autorisation</text>
  <line class="orange" x1="776" y1="595" x2="808" y2="595"/><text x="816" y="599" font-size="11.5" fill="#1F2937">cas de défaut</text>
</svg>
